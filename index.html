<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #333;
      margin: 20px 0;
    }
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gallery img {
      width: 100%;      /* full width of page */
      height: auto;     /* keep original aspect ratio */
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery" id="gallery"></div>

<script>
  const gallery = document.getElementById('gallery');
  const totalPhotos = 10; // Replace with the total number of photos in your folder

  for (let i = 1; i <= totalPhotos; i++) {
    const img = document.createElement('img');
    img.src = `photos/${i}.jpg`;  // your image filenames
    img.alt = `Photo ${i}`;
    img.loading = 'lazy';
    gallery.appendChild(img);
  }
</script>

</body>
</html>
