<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery" id="gallery"></div>

<script>
  const gallery = document.getElementById('gallery');
  const totalPhotos = 10; // Replace with the total number of photos in your folder

  for (let i = 1; i <= totalPhotos; i++) {
    const img = document.createElement('img');
    img.src = `photos/${i}.jpg`; // your images must be named 1.jpg, 2.jpg, etc.
    img.alt = `Photo ${i}`;
    img.loading = 'lazy';
    gallery.appendChild(img);
  }
</script>

</body>
</html>
