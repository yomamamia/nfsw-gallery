<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      padding: 10px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery" id="gallery"></div>

<script>
  const gallery = document.getElementById('gallery');

  // Automatically detect all images in the folder
  // You must list them manually in an array since Cloudflare Pages is static
  // But we can keep it minimal with a naming convention
  const imageCount = 20; // approximate max number of images, adjust if needed
  for (let i = 1; i <= imageCount; i++) {
    const img = new Image();
    img.src = `photos/${i}.jpg`;
    img.alt = `Photo ${i}`;
    img.loading = 'lazy';

    // Check if image exists by loading it
    img.onerror = () => img.remove(); // remove if not exists
    gallery.appendChild(img);
  }
</script>

</body>
</html>
