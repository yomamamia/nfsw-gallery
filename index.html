<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    #photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    #photo-gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      background: #fff;
    }
  </style>
</head>
<body>

<h1>Gallery</h1>

<div id="photo-gallery">
  <!-- Photos will be loaded here -->
</div>

<script>
  const repoOwner = 'yomamamia';
  const repoName = 'nfsw-gallery';

  // PHOTO FOLDERS
  const folderPaths = [
    'new 51',
    'new 58',
    'new 60',
    'new 63'
  ];

  async function loadPhotosFromFolder(folderPath) {
    const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;
    const res = await fetch(url);
    const files = await res.json();

    const gallery = document.getElementById('photo-gallery');

    files.forEach(file => {
      if (
        file.name.endsWith('.jpg') ||
        file.name.endsWith('.jpeg') ||
        file.name.endsWith('.png') ||
        file.name.endsWith('.webp')
      ) {
        const img = document.createElement('img');
        img.src = file.download_url;
        img.loading = 'lazy';
        gallery.appendChild(img);
      }
    });
  }

  async function loadAllPhotos() {
    for (const folderPath of folderPaths) {
      await loadPhotosFromFolder(folderPath);
    }
  }

  loadAllPhotos();
</script>

</body>
</html>
